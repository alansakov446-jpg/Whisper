[project]
name = "whisper-bot"
version = "1.0.0"
description = "Telegram bot for secret whispers"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["bot"]
branch = false
omit = ["bot/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
